name = "AICraft"
npm = "@ai-sdk/openai-compatible"

# AICraft is an OpenAI-compatible gateway. Requests go to
# POST https://aicraftapi.net/v1/chat/completions with a bearer token.
# Create a key in the AICraft Console and see the quick start at
# https://aicraftapi.net/docs.html
#
# Model ids are written as "<vendor>/<model>" in lowercase, for example
# deepseek/deepseek-v4-pro. The catalog is published at
# https://aicraftapi.net/models.html
#
# Pricing and context windows live at https://aicraftapi.net/pricing.html
# (USD per million tokens, accessed 2026-10-16). Each file under models/ states
# the AICraft price and, where the catalog tiers by context length, the higher
# tiers. Everything else is inherited from the referenced base model.
#
# reasoning_options is the one exception: it is never inherited, so it is
# declared per file. For models that reason, AICraft exposes no extra
# effort/toggle control parameter, so the list is empty -- reasoning is
# available, no control parameter is claimed.

env = ["AICRAFT_API_KEY"]
api = "https://aicraftapi.net/v1"
doc = "https://aicraftapi.net/docs.html"
